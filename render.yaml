services:
  # PulseCare Healthcare Fullstack Web Service
  - type: web
    name: pulsecare-healthcare-platform
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
